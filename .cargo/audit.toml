# cargo-audit configuration (REAS-TEST-003). Each ignored advisory has a reason; review the
# list at every release.
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa, Marvin timing attack). `rsa` is a dependency of sqlx-mysql,
    # which is in Cargo.lock through sqlx's optional feature graph but is never compiled:
    # `cargo tree -i rsa --target all` prints nothing. The application only enables the
    # PostgreSQL driver. No fixed version exists upstream.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459 (libsqlite3-sys 0.30.1, the bundled C SQLite). `libsqlite3-sys` is a
    # dependency of sqlx-sqlite, which is in Cargo.lock through sqlx's optional feature graph
    # but is never compiled: `cargo tree -i libsqlite3-sys --target all` prints nothing. The
    # application only enables the PostgreSQL driver. sqlx 0.8 pins 0.30; the fixed version
    # (0.39 or later) needs sqlx 0.9. Remove this entry when sqlx is upgraded.
    "RUSTSEC-2026-0459",
]
