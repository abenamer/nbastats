name: CI
on:
  # Pushes run only on main (the merge commit). Every other branch is covered by its
  # pull request, so one commit no longer starts two identical runs.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nba
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nba_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nba" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://nba:ci@localhost:5432/nba_ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action posts its findings as a check run on the commit.
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - name: Check OKF bundle and links
        run: python scripts/check_docs.py
      - name: Checker tests
        run: python -m unittest discover -s tests/docs -t . -v
